kind: ZarfPackageConfig
metadata:
  name: sovereign-ai-enclave-beelink
  description: "Hardened Beelink GTR9 Pro Core Gateway and Control Plane Dependencies"
  version: "1.0.0"

components:
  - name: internal-core-images
    required: true
    description: "Bundled control-plane, gateway, and local CPU-based 70B inference container images"
    images:
      - ghcr.io/open-webui/open-webui:main
      - docker.io/searxng/searxng:latest
      - docker.io/ollama/ollama:latest
      - ghcr.io/berriai/litellm:latest
      - docker.io/library/python:3.11-slim
      - docker.io/bitnami/kubectl:latest # Image for the managed OpenBao init job

  - name: openbao-security-chart
    required: true
    description: "Packaged OpenBao security barrier Helm chart"
    charts:
      - name: openbao
        url: https://openbao.github.io/openbao-helm
        version: "0.28.4"
        namespace: ai-enclave
        valuesFiles:
          - openbao-values.yaml
    actions:
      onDeploy:
        after:
          - cmd: "kubectl wait --namespace ai-enclave --for=jsonpath='{.status.phase}'=Running pod/openbao-0 --timeout=120s"
    images:
      - docker.io/hashicorp/vault-k8s:1.7.2
      - quay.io/openbao/openbao:2.5.5
      - quay.io/openbao/openbao-csi-provider:2.0.2
      - docker.io/library/busybox:latest
      - docker.io/library/alpine:latest

  - name: managed-openbao-initialization
    required: true
    description: "Deploys a Kubernetes Job to manage OpenBao security barrier initialization and unsealing"
    manifests:
      - name: openbao-init-manifests
        namespace: ai-enclave
        files:
          - ../gitops/base/openbao-init.yaml

  - name: authentik-identity-stack
    required: true
    description: "Packaged Authentik SSO Identity Provider for cluster-wide OIDC"
    charts:
      - name: authentik
        url: https://charts.goauthentik.io
        version: "2024.4.2"
        namespace: ai-enclave
        valuesFiles:
          - authentik-values.yaml
    images:
      - ghcr.io/goauthentik/server:2024.4.2
      - docker.io/bitnamilegacy/postgresql:16.3.0-debian-12-r23
      - docker.io/bitnamilegacy/redis:7.2.5-debian-12-r4

  - name: monitoring-infrastructure-charts
    required: true
    description: "Packaged cluster monitoring aggregation charts (Prometheus/Grafana)"
    charts:
      - name: kube-prometheus-stack
        url: https://prometheus-community.github.io/helm-charts
        version: "61.0.0"
        namespace: ai-enclave
        valuesFiles:
          - prometheus-values.yaml
    images:
      - quay.io/prometheus-operator/prometheus-operator:v0.75.0
      - quay.io/prometheus-operator/prometheus-config-reloader:v0.75.0
      - quay.io/prometheus/prometheus:v2.53.0
      - quay.io/prometheus/alertmanager:v0.27.0
      - docker.io/grafana/grafana:11.1.0
      - docker.io/grafana/grafana:11.0.0
      - quay.io/brancz/kube-rbac-proxy:v0.18.1
      - ghcr.io/jimmidyson/configmap-reload:v0.12.0
      - registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.12.0
      - quay.io/prometheus/node-exporter:v1.8.1
      - registry.k8s.io/ingress-nginx/kube-webhook-certgen:v1.4.1
      - registry.k8s.io/ingress-nginx/kube-webhook-certgen:v20221220-controller-v1.5.1-58-g787ea74b6
      - quay.io/thanos/thanos:v0.35.1
      - quay.io/kiwigrid/k8s-sidecar:1.27.0
      - quay.io/kiwigrid/k8s-sidecar:1.26.1

  - name: cluster-configuration
    required: true
    description: "Deploys cluster-level network policies and observability dashboards"
    manifests:
      - name: cluster-manifests
        namespace: ai-enclave
        files:
          - ../gitops/base/network-policy.yaml
          - ../gitops/base/observability-dashboards.yaml
