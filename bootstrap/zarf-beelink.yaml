kind: ZarfPackageConfig
metadata:
  name: sovereign-ai-enclave-beelink
  description: "Hardened Beelink GTR9 Pro Core Gateway and Control Plane Dependencies"
  version: "1.0.0"

components:
  - name: internal-core-images
    required: true
    description: "Bundled control-plane, gateway, and local CPU-based 70B inference container images"
    images:
      - ghcr.io/open-webui/open-webui:main
      - searxng/searxng:latest
      - ollama/ollama:latest
      - ghcr.io/berriai/litellm:latest
      - python:3.11-slim

  - name: infrastructure-helm-charts
    required: true
    description: "Packaged security, registry, and cluster monitoring aggregation charts for Beelink"
    charts:
      - name: openbao
        url: https://openbao.github.io/openbao-helm
        version: "0.28.4"
        namespace: ai-enclave
      - name: kube-prometheus-stack
        url: https://prometheus-community.github.io/helm-charts
        version: "61.0.0"
        namespace: ai-enclave
