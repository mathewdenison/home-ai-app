kind: ZarfPackageConfig
metadata:
  name: sovereign-ai-model-14b-gguf
  description: "Offline DeepSeek-R1-Distill-Qwen-14B GGUF Model Weight"
  version: "1.0.0"

components:
  - name: model-14b-gguf
    required: true
    description: "Deploys the 14B GGUF model file to the Ollama storage directory (Fallback)"
    files:
      - source: DeepSeek-R1-Distill-Qwen-14B-Q4_K_M.gguf
        target: /home/admin/ai-hub/workspace/ollama/models/DeepSeek-R1-Distill-Qwen-14B-Q4_K_M.gguf
        executable: false
    actions:
      onDeploy:
        after:
          - cmd: |
              echo "Creating Ollama Modelfile for 14B GGUF..."
              cat <<EOF > /home/admin/ai-hub/workspace/ollama/Modelfile-14b
              FROM /root/.ollama/models/DeepSeek-R1-Distill-Qwen-14B-Q4_K_M.gguf
              EOF
              echo "Registering 14B GGUF model in Ollama..."
              kubectl exec -n ai-enclave deployment/ollama-beelink -- ollama create deepseek-r1:14b -f /root/.ollama/Modelfile-14b
