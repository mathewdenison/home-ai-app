# Pull installation files directly from the labeled USB hard drive
harddrive --partition=LABEL=ROCKY-9-8-X --dir=/
lang en_US.UTF-8
keyboard us
timezone UTC --utc
# Enforce the official DISA STIG profile using the OpenSCAP Addon
%addon com_redhat_oscap
    content-type = scap-security-guide
    profile = xccdf_org.ssgproject.content_profile_stig
%end
# ---------------------------------------------------------
# Storage Partitioning Strategy (STIG Compliant LVM RAID 1)
# ---------------------------------------------------------
# Wipe ONLY the NVMe drives
zerombr
clearpart --all --initlabel --drives=nvme0n1,nvme1n1
# Standard EFI Partition
part /boot/efi --fstype=efi --size=600 --ondisk=nvme0n1
# 1. Boot Partition - Mirrored across both drives
part raid.boot1 --size=1024 --ondisk=nvme0n1
part raid.boot2 --size=1024 --ondisk=nvme1n1
raid /boot --device=boot_raid --level=1 --fstype=xfs raid.boot1 raid.boot2
# 2. LVM Physical Volumes - Spanning the rest of both drives
part raid.pv1 --size=1 --grow --ondisk=nvme0n1
part raid.pv2 --size=1 --grow --ondisk=nvme1n1
raid pv.01 --device=pv_raid --level=1 raid.pv1 raid.pv2
# 3. Create the Volume Group
volgroup vg_system pv.01
# 4. Create the STIG-Mandated Logical Volumes
logvol /               --fstype=xfs --name=lv_root          --vgname=vg_system --size=102400
logvol /tmp            --fstype=xfs --name=lv_tmp           --vgname=vg_system --size=10240
logvol /var            --fstype=xfs --name=lv_var           --vgname=vg_system --size=51200
logvol /var/log        --fstype=xfs --name=lv_var_log       --vgname=vg_system --size=20480
logvol /var/log/audit  --fstype=xfs --name=lv_var_log_audit --vgname=vg_system --size=10240
logvol /var/tmp        --fstype=xfs --name=lv_var_tmp       --vgname=vg_system --size=10240
logvol /home           --fstype=xfs --name=lv_home          --vgname=vg_system --size=1 --grow
# Secure Network Configuration (Online Mode)
network --bootproto=dhcp --device=enp2s0 --activate
# Root User Hardening
rootpw --lock
user --name=admin --groups=wheel --plaintext --password=temporary_bootstrap_pass
# Software Selection Block
%packages
@^minimal-environment
openscap
openscap-scanner
scap-security-guide
%end
%post --log=/var/log/kickstart_post.log
mkdir -p /home/admin/ai-hub/workspace/output
chown -R admin:wheel /home/admin/ai-hub
echo "umask 077" >> /etc/profile
%end
reboot
