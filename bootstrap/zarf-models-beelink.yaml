kind: ZarfPackageConfig
metadata:
  name: sovereign-ai-models-beelink
  description: "Offline DeepSeek-R1 70B and 14B GGUF Model Weights for Beelink Gateway"
  version: "1.0.0"

components:
  - name: beelink-model-weights
    required: true
    description: "Deploys the 70B and 14B model files to the Ollama storage directory on the Beelink"
    files:
      - source: DeepSeek-R1-Distill-Llama-70B-Q4_K_M.gguf
        target: /home/admin/ai-hub/workspace/ollama/models/DeepSeek-R1-Distill-Llama-70B-Q4_K_M.gguf
        executable: false
      - source: DeepSeek-R1-Distill-Qwen-14B-Q4_K_M.gguf
        target: /home/admin/ai-hub/workspace/ollama/models/DeepSeek-R1-Distill-Qwen-14B-Q4_K_M.gguf
        executable: false
    actions:
      onDeploy:
        after:
          - cmd: |
              echo "Creating Ollama Modelfiles for Beelink..."
              
              # 70B Heavy Model
              cat <<EOF > /home/admin/ai-hub/workspace/ollama/Modelfile-70b
              FROM /root/.ollama/models/DeepSeek-R1-Distill-Llama-70B-Q4_K_M.gguf
              EOF
              
              # 14B Fallback Model
              cat <<EOF > /home/admin/ai-hub/workspace/ollama/Modelfile-14b
              FROM /root/.ollama/models/DeepSeek-R1-Distill-Qwen-14B-Q4_K_M.gguf
              EOF
              
              echo "Registering models in Ollama..."
              kubectl exec -n ai-enclave deployment/ollama-beelink -- ollama create deepseek-r1:70b -f /root/.ollama/Modelfile-70b
              kubectl exec -n ai-enclave deployment/ollama-beelink -- ollama create deepseek-r1:14b -f /root/.ollama/Modelfile-14b
