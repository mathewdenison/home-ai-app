set default="0"
function load_video {
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod all_video
}
load_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod ext2
set timeout=5
### END /etc/grub.d/00_header ###
search --no-floppy --set=root -l 'ROCKY-9-8-X'
### BEGIN /etc/grub.d/10_linux ###
menuentry 'Automated Kickstart Install Rocky Linux 9' --class fedora --class gnu-linux --class gnu --class os {
    linuxefi /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=ROCKY-9-8-X inst.ks=hd:LABEL=ROCKY-9-8-X:/ks.cfg inst.text nomodeset modprobe.blacklist=amdgpu
    initrdefi /images/pxeboot/initrd.img
}
menuentry 'Test this media & install Rocky Linux' --class fedora --class gnu-linux --class gnu --class os {
    linuxefi /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=ROCKY-9-8-X rd.live.check inst.text nomodeset modprobe.blacklist=amdgpu
    initrdefi /images/pxeboot/initrd.img
}
menuentry 'Install Rocky Linux in FIPS mode' --class fedora --class gnu-linux --class gnu --class os {
    linuxefi /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=ROCKY-9-8-X fips=1 inst.text nomodeset modprobe.blacklist=amdgpu
    initrdefi /images/pxeboot/initrd.img
}
submenu 'Troubleshooting -->' {
    menuentry 'Install Rocky Linux in text mode' --class fedora --class gnu-linux --class gnu --class os {
        linuxefi /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=ROCKY-9-8-X inst.text nomodeset modprobe.blacklist=amdgpu
        initrdefi /images/pxeboot/initrd.img
    }
    menuentry 'Rescue a Rocky Linux system' --class fedora --class gnu-linux --class gnu --class os {
        linuxefi /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=ROCKY-9-8-X inst.rescue inst.text nomodeset modprobe.blacklist=amdgpu
        initrdefi /images/pxeboot/initrd.img
    }
}
