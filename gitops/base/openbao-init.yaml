apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openbao-init-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "secrets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-init-binding
subjects:
  - kind: ServiceAccount
    name: openbao-init-sa
    namespace: ai-enclave
roleRef:
  kind: ClusterRole
  name: openbao-init-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-init-sa
  namespace: ai-enclave
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-auto-init
  namespace: ai-enclave
spec:
  template:
    spec:
      serviceAccountName: openbao-init-sa
      restartPolicy: OnFailure
      containers:
        - name: initializer
          image: docker.io/bitnami/kubectl:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "⏳ [1/5] Waiting for OpenBao pod to reach Running phase..."
              until [ "$(kubectl get pod openbao-0 -n ai-enclave -o jsonpath='{.status.phase}' 2>/dev/null)" == "Running" ]; do
                echo "..."
                sleep 5
              done
              
              echo "🚀 [2/5] OpenBao pod detected. Verifying initialization status..."
              # Loop until 'bao status' returns a valid output (handles container start delay)
              until kubectl exec openbao-0 -n ai-enclave -- bao status >/dev/null 2>&1 || [ $? -eq 2 ]; do
                sleep 2
              done

              if kubectl exec openbao-0 -n ai-enclave -- bao status 2>&1 | grep -q "Initialized.*false"; then
                echo "🔒 [3/5] OpenBao uninitialized. Starting security barrier initialization..."
                
                # 1. Initialize and capture payload
                INIT_PAYLOAD=$(kubectl exec openbao-0 -n ai-enclave -- bao operator init -key-shares=1 -key-threshold=1 -format=json)
                
                # 2. Extract tokens (Standard grep for alpine/bitnami compatibility)
                ROOT_TOKEN=$(echo "$INIT_PAYLOAD" | grep -o '"root_token":"[^"]*' | grep -o '[^"]*$')
                UNSEAL_KEY=$(echo "$INIT_PAYLOAD" | grep -o '"unseal_keys_b64":\["[^"]*"' | grep -o '[^"]*"' | tail -n 1 | tr -d '"')
                
                echo "💾 [4/5] Writing master keys to cluster secrets..."

                # Create/Update Cluster Secret with both root token and unseal key
                kubectl create secret generic openbao-root-token \
                  --namespace ai-enclave \
                  --from-literal=token="$ROOT_TOKEN" \
                  --from-literal=unseal-key="$UNSEAL_KEY" \
                  --dry-run=client -o yaml | kubectl apply -f -

                echo "🔓 [5/5] Performing initial unseal..."
                kubectl exec openbao-0 -n ai-enclave -- bao operator unseal "$UNSEAL_KEY"
                
                echo "✨ OpenBao successfully initialized and unsealed."
              else
                echo "ℹ️ OpenBao is already initialized. Checking seal status..."
                if kubectl exec openbao-0 -n ai-enclave -- bao status 2>&1 | grep -q "Sealed.*true"; then
                  echo "🔓 Detected sealed vault. Attempting auto-unseal from cluster secrets..."
                  UNSEAL_KEY_B64=$(kubectl get secret openbao-root-token -n ai-enclave -o jsonpath='{.data.unseal-key}' 2>/dev/null)
                  if [ -n "$UNSEAL_KEY_B64" ]; then
                    UNSEAL_KEY=$(echo "$UNSEAL_KEY_B64" | base64 -d 2>/dev/null || echo "$UNSEAL_KEY_B64" | base64 --decode)
                    kubectl exec openbao-0 -n ai-enclave -- bao operator unseal "$UNSEAL_KEY"
                    echo "✅ Re-unsealed successfully."
                  else
                    echo "⚠️ No unseal key found in cluster secret. Manual unseal required."
                  fi
                else
                  echo "✅ OpenBao is already unsealed and ready."
                fi
              fi

              echo "🛡️ [6/5] Configuring OpenBao Access Control Policies..."
              # Fetch Root Token if not already in memory
              if [ -z "$ROOT_TOKEN" ]; then
                ROOT_TOKEN_B64=$(kubectl get secret openbao-root-token -n ai-enclave -o jsonpath='{.data.token}' 2>/dev/null)
                ROOT_TOKEN=$(echo "$ROOT_TOKEN_B64" | base64 -d 2>/dev/null || echo "$ROOT_TOKEN_B64" | base64 --decode)
              fi

              # Helper function for bao commands
              bao_cmd() {
                kubectl exec openbao-0 -n ai-enclave -- env BAO_TOKEN="$ROOT_TOKEN" bao "$@"
              }

              # 1. Enable Kubernetes Auth Method
              if ! bao_cmd auth list | grep -q "kubernetes/"; then
                bao_cmd auth enable kubernetes
              fi

              # 2. Configure Kubernetes Auth to talk to local API
              bao_cmd write auth/kubernetes/config \
                kubernetes_host="https://kubernetes.default.svc" \
                disable_iss_validation=true

              # 3. Create a policy for the Enclave application pods
              # Grants read access to the 'enclave' secret path
              echo 'path "secret/data/enclave/*" { capabilities = ["read"] }' | kubectl exec -i openbao-0 -n ai-enclave -- env BAO_TOKEN="$ROOT_TOKEN" bao policy write enclave-policy -

              # 4. Create a role that binds the ServiceAccount to the policy
              bao_cmd write auth/kubernetes/role/enclave-role \
                bound_service_account_names="*" \
                bound_service_account_namespaces="ai-enclave" \
                policies="enclave-policy" \
                ttl="24h"

              # 5. Seed initial placeholder secrets if they don't exist
              if ! bao_cmd kv get secret/enclave/runtime >/dev/null 2>&1; then
                bao_cmd kv put secret/enclave/runtime \
                  OPENID_PROVIDER_SECRET="placeholder-oidc-secret" \
                  SEARXNG_SECRET_KEY="placeholder-searxng-key" \
                  LITELLM_MASTER_KEY="local-enclave-key"
              fi

              echo "✨ OpenBao security policies and auth methods fully provisioned."
